server:
  port: 8080

spring:
  application:
    name: launchcheck-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/launchcheck}
    username: ${SPRING_DATASOURCE_USERNAME:launchcheck}
    password: ${SPRING_DATASOURCE_PASSWORD:launchcheck}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

launchcheck:
  security:
    jwt-secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.launchcheck: INFO
    org.apache.hc.client5.http: INFO
    org.flywaydb: INFO

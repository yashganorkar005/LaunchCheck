server:
  port: 0

spring:
  application:
    name: launchcheck-api-test
  datasource:
    url: jdbc:h2:mem:launchcheck;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

launchcheck:
  security:
    jwt-secret: 0123456789012345678901234567890123456789012345678901234567890123
    jwt-expiration-ms: 86400000

logging:
  level:
    com.launchcheck: INFO
    org.flywaydb: INFO

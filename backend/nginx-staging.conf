user
server {
    listen 80;
    server_name staging.launchcheck.io;

    # Redirect HTTP to HTTPS in production/staging
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.launchcheck.io;

    ssl_certificate /etc/letsencrypt/live/staging.launchcheck.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.launchcheck.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/launchcheck/frontend/dist;
    index index.html index.htm;

    # Rate limiting zone definition (15 req/min per IP, burst=5)
    # limit_req_zone $binary_remote_addr zone=audit_limit:10m rate=15r/m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Apply rate limiting to audit and API routes
        # limit_req zone=audit_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Securely forward real client IP from trusted proxy
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts and payload limits
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 1M;
    }

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        access_log off;
    }
}
